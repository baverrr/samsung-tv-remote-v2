archgram: 1
title: Samsung & Apple TV Remote
description: >-
  The remote window, the command line and the ESP32 bridge all get their TV
  client from make_client, which hands back the Samsung client or the Apple
  TV client; both offer the same methods, so every entry point works with
  either TV. The Samsung client talks to the TV over WebSocket, REST and
  DLNA and wakes it with Wake-on-LAN; the Apple TV client goes through
  pyatv. To cast, the window or command line starts a small file server on the PC, and the TV fetches the file from it.
  An ESP32 touch screen drives the bridge over HTTP.
direction: down
